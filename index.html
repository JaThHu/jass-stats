<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jass-Stats" />
    <title>Jass-Stats</title>
    <script>
      window.addEventListener('error', function(e) {
        document.body.style.background = '#0b0f0e';
        document.body.innerHTML = '<pre style="color:#ef5b5b;padding:20px;white-space:pre-wrap">ERROR: ' + e.message + '\n' + (e.filename||'') + ':' + e.lineno + '\n' + (e.error ? e.error.stack : '') + '</pre>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.style.background = '#0b0f0e';
        document.body.innerHTML = '<pre style="color:#ef5b5b;padding:20px;white-space:pre-wrap">UNHANDLED: ' + String(e.reason) + '</pre>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
