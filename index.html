<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jass-stats</title>
    <script>
      window.addEventListener('error', function(e) {
        document.body.style.background = '#fff';
        document.body.innerHTML = '<pre style="color:red;padding:20px;white-space:pre-wrap">ERROR: ' + e.message + '\n' + (e.filename||'') + ':' + e.lineno + '\n' + (e.error ? e.error.stack : '') + '</pre>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.style.background = '#fff';
        document.body.innerHTML = '<pre style="color:red;padding:20px;white-space:pre-wrap">UNHANDLED: ' + String(e.reason) + '</pre>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
